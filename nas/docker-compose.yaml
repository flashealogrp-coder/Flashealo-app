name: flashealo-web
services:
  minio:
    image: minio/minio:latest
    container_name: flashealo-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: ${SITE_URL}
    volumes:
      - /volume1/flashealo-fotos:/data
    networks: [flashealo_net]
  web:
    build:
      context: ./app
      dockerfile: nas/Dockerfile
      args:
        VITE_SUPABASE_URL: ${API_URL}
        VITE_SUPABASE_ANON_KEY: ${ANON_KEY}
        VITE_R2_DOMINIO: ${CDN_URL}
        VITE_R2_DOMINIO_PUBLICO: ${CDN_URL}
    container_name: flashealo-web
    restart: unless-stopped
    environment:
      SUPABASE_URL: http://kong:8000
      SUPABASE_KEY: ${ANON_KEY}
      R2_ENDPOINT: ${S3_URL}
      R2_BUCKET_NAME: flashealo-fotos
      R2_ACCESS_KEY_ID: ${MINIO_USER}
      R2_SECRET_ACCESS_KEY: ${MINIO_PASSWORD}
      S3_PATH_STYLE: "1"
    networks: [flashealo_net]
networks:
  flashealo_net:
    external: true
